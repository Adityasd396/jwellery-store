{% extends "base.html" %}
{% block title %}Server error{% endblock %}

{% block content %}
<div class="card" style="max-width:520px;margin:40px auto;text-align:center">
  <div style="font-size:44px;opacity:.35">500</div>
  <h1 style="font-size:20px;margin:8px 0">Something went wrong</h1>
  <p class="mini">Nothing was saved — the last action was rolled back. Check the server log for details.</p>
  <div class="form-actions" style="justify-content:center">
    <a href="{{ url_for('index') }}" class="btn btn-gold">Back to dashboard</a>
  </div>
</div>
{% endblock %}
